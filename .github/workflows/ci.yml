name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml から、タグの中身に対して同じテストを回すために呼ばれる。
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
      - run: lune run test/schema.test.luau
      - run: lune run test/normalize.test.luau
      - run: lune run test/session.test.luau
      - run: node test/cross-check.js
      - run: lune run test/plugin-syntax.test.luau
